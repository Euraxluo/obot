<!doctype html>
<html lang="zh-CN" class="default-scrollbar">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// One-shot: drop locale that was auto-persisted from browser preferredLanguage
			// before baseLocale became zh-CN; afterwards only explicit LanguageSelect sticks.
			(function () {
				try {
					if (!localStorage.getItem('ztocc_locale_default_v1')) {
						localStorage.removeItem('PARAGLIDE_LOCALE');
						localStorage.setItem('PARAGLIDE_LOCALE', 'zh-CN');
						localStorage.setItem('ztocc_locale_default_v1', '1');
					}
				} catch (e) {}
			})();
		</script>
		<script>
			// Keep in sync with `getIsDark()` in `src/lib/stores/darkmode.svelte.ts`
			(function () {
				function getIsDark() {
					var theme = localStorage.getItem('theme') ?? 'system';
					if (theme === 'dark') return true;
					if (theme === 'light') return false;
					return window.matchMedia('(prefers-color-scheme: dark)').matches;
				}
				if (getIsDark()) {
					document.documentElement.classList.add('dark');
					document.documentElement.setAttribute('data-theme', 'nanobotdark');
				} else {
					document.documentElement.classList.remove('dark');
					document.documentElement.setAttribute('data-theme', 'nanobotlight');
				}
			})();
		</script>
		<style>
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--color-base-100, #f2f7f4);
				z-index: 9999;
				transition: opacity 0.15s ease-out;
			}
			html.dark #initial-loader {
				background: var(--color-base-100, #0e1514);
			}
			#initial-loader .spinner {
				box-sizing: border-box;
				width: 32px;
				height: 32px;
				border: 3px solid var(--color-base-200, #e4eee9);
				border-top-color: var(--color-primary, #159a91);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			html.dark #initial-loader .spinner {
				border-color: var(--color-base-200, #1e2b29);
				border-top-color: var(--color-primary, #159a91);
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			#initial-loader.loaded {
				opacity: 0;
				pointer-events: none;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="initial-loader"><div class="spinner"></div></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
